[package]
name = "manager"
description = "Surface Coordinator Manager: the operator's desktop app"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coordinator-core.workspace = true
protocol.workspace = true

axum.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
# Self-update from the repository's GitHub releases; only registered when
# the build has an updater public key (see build.rs).
tauri-plugin-updater = "2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

[target.'cfg(windows)'.dependencies]
# Mobile Hotspot (WinRT tethering API). 0.62 is what Tauri already pulls in.
windows = { version = "0.62", features = [
    "Foundation",
    "Networking",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
] }

[dev-dependencies]
tempfile.workspace = true
