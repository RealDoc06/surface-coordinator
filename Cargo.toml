[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/coordinator-core",
    "crates/coordinator",
    "crates/client",
    "crates/manager",
    "crates/release-tool",
]
# The manager needs the desktop (webview) toolchain; build it explicitly
# with `cargo build -p manager`.
default-members = [
    "crates/protocol",
    "crates/coordinator-core",
    "crates/coordinator",
    "crates/client",
    "crates/release-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/RealDoc06/surface-coordinator"

[workspace.dependencies]
protocol = { package = "surface-coordinator-protocol", path = "crates/protocol" }
coordinator-core = { path = "crates/coordinator-core" }

anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "process", "io-util", "fs"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
